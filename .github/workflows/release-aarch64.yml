name: Publish AArch64 stable repository

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-aarch64.yml
      - bin/build
      - bin/check-official-stable
      - bin/download-aarch64-baseline
      - bin/prepare-github-release
      - bin/promote-build
      - bin/publish-github-release
      - bin/repo
      - bin/release-aarch64
      - bin/sign
      - bin/sign-database
      - bin/update-repo
      - bin/write-aarch64-release-state
      - build/**
      - config/aarch64-*
      - helpers/**
      - pkgbuilds/**
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published version set is current
        type: boolean
        default: false

concurrency:
  group: aarch64-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate recipes against official stable
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm curl jq libarchive >/dev/null
              groupadd -g "$HOST_GID" runner
              useradd -m -u "$HOST_UID" -g "$HOST_GID" runner
              runuser -u runner -- ./bin/check-official-stable --json
            ' > repository-version-set.json

      - name: Decide whether the rolling repository needs an update
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published-version-set.json"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/repository-version-set.json"
          : > aarch64-retry-packages
          if curl -fsSL --retry 3 -o "$published" "$url"; then
            while IFS= read -r package; do
              if grep -Fxq "$package" config/aarch64-packages; then
                printf '%s\n' "$package" >> aarch64-retry-packages
              fi
            done < <(jq -r '.failed_packages[]?' "$published")
            published_available=true
          else
            published_available=false
          fi

          if [[ "$FORCE" == "true" ]]; then
            sed -E '/^[[:space:]]*(#|$)/d' config/aarch64-packages > aarch64-retry-packages
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$published_available" != true ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif cmp -s repository-version-set.json "$published"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "The published AArch64 rolling repository is current."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.should_build == 'true'
        with:
          name: aarch64-version-set
          path: |
            repository-version-set.json
            aarch64-retry-packages
          retention-days: 1

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      should_publish: ${{ steps.result.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-version-set

      - name: Seed the latest verified repository database
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/download-aarch64-baseline --database-only

      - name: Build changed stable packages natively
        env:
          OMARCHY_REPOSITORY_SERVER: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -euo pipefail
          mapfile -t packages < <(sed -E '/^[[:space:]]*(#|$)/d' config/aarch64-packages)
          mapfile -t retries < <(sed -E '/^[[:space:]]*(#|$)/d' aarch64-retry-packages)
          build_args=(--arch aarch64 --mirror stable --force-explicit --allow-partial --package "${packages[@]}")
          (( ${#retries[@]} == 0 )) || build_args+=(--rebuild-package "${retries[@]}")
          ./bin/repo build "${build_args[@]}"
          touch build-output/stable/aarch64/.complete

      - name: Summarize the partial build
        id: result
        run: |
          set -euo pipefail
          output=build-output/stable/aarch64
          shopt -s nullglob
          archives=("$output"/*.pkg.tar.zst)
          failures=()
          [[ ! -s "$output/.failed-packages" ]] || mapfile -t failures < "$output/.failed-packages"

          if (( ${#failures[@]} > 0 )); then
            echo "::warning title=AArch64 partial build::${#failures[@]} package base(s) failed; ${#archives[@]} successful archive(s) will still be published."
            {
              echo "### Partial AArch64 build"
              echo
              echo "Successful archives: ${#archives[@]}"
              echo
              echo "Failed package bases (kept at their previous published versions and retried next run):"
              printf -- '- `%s`\n' "${failures[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if (( ${#archives[@]} > 0 || ${#failures[@]} == 0 )); then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No package was built successfully; leaving the current rolling Release untouched."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-changed-packages
          path: build-output/stable/aarch64
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.should_build == 'true' && needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-version-set

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-changed-packages
          path: build-output/stable/aarch64

      - name: Seed the published repository database
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/download-aarch64-baseline --database-only

      - name: Sign and validate the pacman repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.AARCH64_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.AARCH64_GPG_PASSPHRASE }}
        run: ./bin/prepare-github-release --version-set repository-version-set.json

      - name: Incrementally publish the rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/publish-github-release
