name: Publish AArch64 stable repository

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published version set is current
        type: boolean
        default: false

concurrency:
  group: aarch64-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate recipes against official stable
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm curl jq libarchive >/dev/null
              groupadd -g "$HOST_GID" runner
              useradd -m -u "$HOST_UID" -g "$HOST_GID" runner
              runuser -u runner -- ./bin/check-official-stable --json
            ' > repository-version-set.json

      - name: Decide whether a snapshot is needed
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published-version-set.json"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/repository-version-set.json"
          if [[ "$FORCE" == "true" ]] || ! curl -fsSL --retry 3 -o "$published" "$url"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif cmp -s repository-version-set.json "$published"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "The published AArch64 stable snapshot is current."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.should_build == 'true'
        with:
          name: aarch64-version-set
          path: repository-version-set.json
          retention-days: 1

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-version-set

      - name: Seed the latest verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/download-aarch64-baseline

      - name: Build changed stable packages natively
        run: |
          set -euo pipefail
          mapfile -t packages < <(sed -E '/^[[:space:]]*(#|$)/d' config/aarch64-packages)
          ./bin/repo build --arch aarch64 --mirror stable --force-explicit --package "${packages[@]}"
          touch build-output/stable/aarch64/.complete

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-changed-packages
          path: build-output/stable/aarch64
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-version-set

      - uses: actions/download-artifact@v8
        with:
          name: aarch64-changed-packages
          path: build-output/stable/aarch64

      - name: Assemble the complete unsigned snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./bin/download-aarch64-baseline
          shopt -s nullglob
          baseline=(pkgs.omarchy.org/stable/aarch64/*.pkg.tar.zst)
          if (( ${#baseline[@]} > 0 )); then
            cp --no-clobber -- "${baseline[@]}" build-output/stable/aarch64/
          fi
          rm -f build-output/stable/aarch64/.complete

      - name: Sign and validate the pacman repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.AARCH64_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.AARCH64_GPG_PASSPHRASE }}
        run: ./bin/prepare-github-release --version-set repository-version-set.json

      - name: Upload and verify a draft Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_dir=pkgs.omarchy.org/stable/aarch64
          official_version=$(jq -r '.packages[] | select(.name == "omarchy") | .official_version' repository-version-set.json)
          tag="repo-${official_version}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Omarchy AArch64 stable ${official_version}" \
            --notes "Signed AArch64 pacman repository snapshot following pkgs.omarchy.org stable ${official_version}." \
            "$repo_dir"/*.pkg.tar.zst \
            "$repo_dir"/*.pkg.tar.zst.sig \
            "$repo_dir"/omarchy.db \
            "$repo_dir"/omarchy.db.sig \
            "$repo_dir"/omarchy.db.tar.zst \
            "$repo_dir"/omarchy.db.tar.zst.sig \
            "$repo_dir"/omarchy.files \
            "$repo_dir"/omarchy.files.sig \
            "$repo_dir"/omarchy.files.tar.zst \
            "$repo_dir"/omarchy.files.tar.zst.sig \
            "$repo_dir"/omarchy-aarch64.gpg \
            "$repo_dir"/repository-version-set.json \
            "$repo_dir"/repository-manifest.json \
            "$repo_dir"/SHA256SUMS

          downloaded="$RUNNER_TEMP/release-assets"
          mkdir -p "$downloaded"
          gh release download "$tag" --dir "$downloaded"
          (cd "$downloaded" && sha256sum -c SHA256SUMS)

      - name: Publish the verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
